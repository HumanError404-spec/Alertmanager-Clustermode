- name: Create group if doesn't exist
  ansible.builtin.group:
    name: "{{ alertmanager_group }}"
    state: present

- name: Create User if doesn't exist
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    state: present
    group: "{{ alertmanager_group }}"
    create_home: false
    system: true
    shell: /usr/sbin/nologin

