- name: Create config directory
  ansible.builtin.file:
    path: "{{ config_directory }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: '0755'

- name: Alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ config_directory }}/alertmanager.yml"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: '0644'
  notify: reload systemd and restart alertmanager

- name: Create data directory
  ansible.builtin.file:
    path: "{{ alertmanager_storage_path }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: '0755'

- name: Alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: "{{ systemd_directory }}/alertmanager.service"
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd and restart alertmanager

- name: Run and Enable Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Alertmanager to be ready
  ansible.builtin.uri:
    url: http://localhost:9093/-/ready
    status_code: 200
  retries: 10
  delay: 3
  register: result
  until: result.status == 200
